<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir no rePraça</title>
    <meta name="description" content="Esta praça abre na app rePraça. Instala-a para a reimaginares à tua maneira.">
    <link rel="icon" type="image/x-icon" href="https://repraca.feliperpv.com/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/abrir-app.css">
</head>
<body>

    <div class="capa" aria-hidden="true"></div>

    <main>
        <img class="icone-app" src="https://repraca.feliperpv.com/img/repraca-icone.png" width="112" height="112" alt="Ícone da app rePraça">

        <h1>Quase lá!</h1>
        <p class="subtitulo">Esta praça abre na app <b>rePraça</b>. Instala-a para a reimaginares à tua maneira.</p>

        <div class="cartoes">
            <section class="cartao">
                <p class="etiqueta">No telemóvel</p>
                <p class="cartao-texto">Instala a app e volta a abrir este link.</p>

                <a href="https://play.google.com/store/apps/details?id=com.frpv.rePraca">
                    <img src="https://repraca.feliperpv.com/img/badge-GooglePlay_Web_color_Portuguese-Portugal.svg" width="200" alt="Disponível no Google Play">
                </a>
                <!-- TODO: trocar pelo link da App Store quando a app iOS estiver publicada -->
                <a href="LINK_DA_APP_STORE">
                    <img src="https://repraca.feliperpv.com/img/bade-appstore-portugal.svg" width="200" alt="Descarregar na App Store">
                </a>
            </section>

            <section class="cartao">
                <p class="etiqueta">No computador</p>
                <p class="cartao-texto">Aponta a câmara do telemóvel ao código para continuares lá.</p>

                <div id="qrcode" class="moldura-qr"></div>
            </section>
        </div>

        <!-- O destino certo (página da praça ou galeria) é posto pelo js/qrcode.js -->
        <a id="voltarGaleria" class="btn-galeria" href="https://repraca.feliperpv.com/galeria/">Voltar à galeria</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="../js/qrcode.js"></script>
</body>
</html>
